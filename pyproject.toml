[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dx-daemon"
version = "0.1.0"
description = "A lightweight daemon starter for DX workflows"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "DX Karthik" }
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.14"]

[project.scripts]
dx-daemon = "dx_daemon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
# Honor the excludes below even when a file is named explicitly on the command
# line (editors and pre-commit pass file paths directly).
force-exclude = true
extend-exclude = [
  # Standalone scratch scripts, not part of the package (see spec.md section 1).
  "src/dx_daemon/sample_script.py",
  "src/dx_daemon/math_functions.py",
  "src/dx_daemon/number_crunch.py",
  "src/dx_daemon/stats.py",
  "src/dx_daemon/file_organizer.py",
  "src/dx_daemon/compress_images.py",
  "src/dx_daemon/img_to_jpeg.py",
  "javascript_samples",
  "ruby_samples",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
